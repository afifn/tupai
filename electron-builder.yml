appId: com.tupai.app
productName: Tupai
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  # worker_threads cannot load a script from inside an asar archive: the thread
  # starts outside Electron's patched fs. The worker and the chunks it imports
  # must exist as real files, so they are unpacked and the path is rewritten in
  # src/main/workers/dbWorkerClient.ts.
  - 'out/main/**'
  # The unpacked worker resolves its imports from disk, so the packages it loads
  # must live outside the archive as well. Keeping only the natives unpacked made
  # `bindings` (a plain JS package) unreachable from the worker.
  # This also covers the native modules (better-sqlite3, oracledb) and the
  # optional native helpers ssh2 loads at runtime (cpu-features).
  - 'node_modules/**'
npmRebuild: true
# The worker is an ES module that runs from app.asar.unpacked, outside the app's
# own package.json. Without a marker Node falls back to CommonJS and every
# connection fails with "Cannot use import statement outside a module", because
# the nearest package.json is the archive root, which the worker cannot read.
# This file makes the unpacked directory ESM on every platform.
extraResources:
  - from: build/worker-package.json
    to: app.asar.unpacked/out/main/package.json
# Update feed. electron-builder writes latest.yml / latest-mac.yml next to the
# artifacts, and electron-updater reads them from the matching GitHub release, so
# a Windows install only ever sees the Windows installer and a mac install only
# the mac zip. Building locally does not upload anything; `npm run release:mac`
# and `release:win` pass --publish always.
publish:
  provider: github
  owner: afifn
  repo: tupai
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
# Two separate artifacts instead of a universal binary: a universal build needs
# lipo for every native module (better-sqlite3, cpu-features) and mergeASARs,
# which fails in ways that are hard to diagnose. Separate downloads are also
# smaller per user.
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Electron 45 runs Chromium 156, which dropped macOS 12. Declaring the floor
  # makes the DMG refuse to install on an unsupported system instead of crashing
  # after launch.
  minimumSystemVersion: '13.0'
  # No arch list here: an arch inside the target overrides the --arm64/--x64
  # flag, so `dist:mac:arm64` used to build both arches. The scripts pass the
  # arch explicitly instead.
  target:
    - dmg
    - zip
  # Hardened runtime is required for notarization. Unsigned builds ignore it,
  # so the same configuration works before an Apple Developer account exists.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Signing and notarization are skipped automatically when no identity or
  # APPLE_* credentials are present; see DEVELOPING.md for the unsigned flow.
dmg:
  # The title becomes the mounted volume name. Both arches build in parallel
  # and would otherwise attach the same volume ("Tupai 0.0.1"), making
  # hdiutil detach fail with "resource busy" and the whole build exit 1.
  title: ${productName} ${version} ${arch}
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications
